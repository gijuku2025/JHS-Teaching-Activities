<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match It</title>
<style>
:root{--jade:#1E8A5B;--jade-d:#0F5A3A;--gold:#E8C45A;--gold-d:#A8841F;--ink:#1D2B3A;--en:#1B3F8F;--ja:#B3261E;--wood1:#8B5A36;--wood2:#5E3A20;--socket:#0A3626;--face:linear-gradient(#FFFDF4,#EEE7D2)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#F5F0DC;background:radial-gradient(ellipse at 50% 25%,#17694A,#0B3B29 85%) fixed;font:18px/1.4 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:1040px;margin:0 auto;padding:16px}
h1{margin:0 0 12px;font:800 2rem/1.2 "Hiragino Mincho ProN","Yu Mincho",Georgia,serif}
.serif,.tile,.slot .lab{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif}

/* big ivory tile used for setup / results / pop-ups */
.card{background:var(--face);color:var(--ink);border-radius:18px;border:1px solid #CFC7AE;padding:26px;max-width:470px;margin:7vh auto 0;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),inset 0 0 0 5px rgba(0,0,0,.07),0 12px 0 var(--jade),0 12px 0 1px var(--jade-d),0 22px 24px rgba(0,0,0,.45)}
.card label{display:block;margin:14px 0;font-weight:600}
.card input,.card select{display:block;width:100%;margin-top:6px;padding:10px;font:inherit;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px 26px;border:0;border-bottom:5px solid var(--gold-d);border-radius:10px;background:var(--gold);color:var(--ink);cursor:pointer}
button:active{transform:translateY(2px);border-bottom-width:3px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{color:#B3261E;font-weight:600}

/* header */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar b{font:700 1.4rem "Hiragino Mincho ProN","Yu Mincho",Georgia,serif;color:var(--gold)}
.clock{min-width:74px;text-align:center;padding:2px 14px;border-radius:999px;background:var(--face);color:var(--ink);font:800 1.8rem/1.4 system-ui;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--jade-d),0 8px 10px rgba(0,0,0,.4)}
.clock.low{color:var(--ja)}
.meter{height:8px;background:rgba(0,0,0,.35);border-radius:8px;overflow:hidden;margin:12px 0 10px}
.meter i{display:block;height:100%;width:100%;background:var(--gold)}
.hint{margin:0 0 12px;opacity:.9;font-size:.95rem}

/* wooden tile rack */
.tray{display:flex;flex-wrap:wrap;gap:14px 12px;padding:18px 16px 12px;min-height:84px;margin-bottom:22px;border-radius:14px;background:linear-gradient(var(--wood1),var(--wood2));border-bottom:8px solid #3E2412;box-shadow:inset 0 4px 10px rgba(0,0,0,.5),0 8px 14px rgba(0,0,0,.35)}

/* mah-jong tile: ivory face, jade back showing underneath */
.tile{padding:10px 16px;border-radius:9px;background:var(--face);border:1px solid #CFC7AE;font-weight:700;font-size:1.05rem;line-height:1.3;cursor:grab;touch-action:none;white-space:nowrap;margin-bottom:7px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 0 4px rgba(0,0,0,.07),0 6px 0 var(--jade),0 6px 0 1px var(--jade-d),0 10px 8px rgba(0,0,0,.4)}
.tile.en{color:var(--en)}.tile.ja{color:var(--ja)}
.tray.sent .tile{white-space:normal;max-width:340px}
.tile.lifted{opacity:.2}
.tile.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(-2deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 6px 0 var(--jade),0 6px 0 1px var(--jade-d),0 18px 20px rgba(0,0,0,.5)}
.tile.placed{cursor:default;touch-action:auto;margin:0}

/* board */
.board{display:grid;gap:12px}
.board.pairs{grid-template-columns:repeat(auto-fill,minmax(390px,1fr))}
.slot{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(232,196,90,.25)}
.slot:not(.row) .lab{flex:0 0 42%;padding:10px 14px;border-radius:9px;background:var(--face);border:1px solid #CFC7AE;font-weight:700;font-size:1.05rem;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 0 4px rgba(0,0,0,.07)}
.slot.en:not(.row) .lab{color:var(--en)}.slot.ja:not(.row) .lab{color:var(--ja)}
.well{flex:1;min-height:66px;display:flex;align-items:center;padding:6px 6px 12px;border-radius:10px;background:var(--socket);box-shadow:inset 0 4px 9px rgba(0,0,0,.65);border:2px dashed rgba(232,196,90,.4)}
.slot.row{flex-wrap:wrap;gap:8px 14px;padding:12px}
.slot.row .lab{flex:0 1 auto;font-size:1.15rem;font-weight:600;color:#F5F0DC}
.slot.row .well{flex:1 1 280px}
.slot.hover{background:rgba(232,196,90,.16);border-color:var(--gold)}
.slot.hover .well{border-color:var(--gold)}
.slot.done{background:rgba(232,196,90,.13);border-color:var(--gold)}
.slot.done .well{background:transparent;box-shadow:none;border-color:transparent}
.slot.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* pop-ups and results */
.over{position:fixed;inset:0;background:rgba(4,22,15,.78);display:grid;place-items:center;z-index:60;padding:16px}
.over .card{margin:0;text-align:center}
.big{font:800 2.8rem "Hiragino Mincho ProN","Yu Mincho",Georgia,serif;margin:6px 0 14px}
.res{width:100%;border-collapse:collapse;margin:14px 0 20px;text-align:left}
.res td{padding:10px 6px;border-bottom:1px solid #C9C4B4}
.res td:last-child{text-align:right;font-weight:800;font-size:1.3rem;white-space:nowrap}
@media(max-width:480px){.board.pairs{grid-template-columns:1fr}.slot:not(.row) .lab{flex-basis:40%}}
@media(prefers-reduced-motion:reduce){.slot.shake{animation:none}}
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
/* Content lives in vocab.json and sentences.json (same folder as this file).
   Chapters come from vocab.json; sentences are matched by id ("ss-ch15" ↔ "ch15").
   Rounds: 1 = English→Japanese, 2 = Japanese→English,
           3 and 4 = the chapter's sentences, split into two halves.
   A chapter with no sentences plays rounds 1 and 2 only. */
const SECONDS = [60, 60, 60, 60];   // time limit for rounds 1, 2, 3, 4

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let CH = {}, S = {};

async function load() {
  try {
    const [v, s] = await Promise.all(['vocab.json', 'sentences.json'].map(u =>
      fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); })));
    v.chapters.forEach(c => {
      const key = c.id.replace(/^ss-/, '');
      const sc = s.chapters.find(x => x.id === key);
      CH[c.id] = { label: sc ? sc.title : c.name, words: c.words, sentences: sc ? sc.sentences : [] };
    });
    setup();
  } catch (err) {
    app.innerHTML = `<div class="card"><h1>Can't load the game</h1><p class="msg">Could not read ${esc(err.message)}.</p>
      <p>Open the game from its web address (GitHub Pages) or a local server, and keep vocab.json and sentences.json next to index.html.</p></div>`;
  }
}

function setup() {
  app.innerHTML = `<div class="card"><h1>Match It</h1>
    <label>Your name<input id="name" autocomplete="off" maxlength="40"></label>
    <label>Chapter<select id="ch">${Object.keys(CH).map(k => `<option value="${esc(k)}">${esc(CH[k].label)}</option>`).join('')}</select></label>
    <button id="go" disabled>Start</button></div>`;
  const name = document.getElementById('name'), go = document.getElementById('go');
  name.oninput = () => go.disabled = !name.value.trim();
  go.onclick = () => { S = { name: name.value.trim(), ch: document.getElementById('ch').value, scores: [], totals: [], misses: 0 }; round(0); };
  name.focus();
}

function round(r) {
  const ch = CH[S.ch], sent = r >= 2, nRounds = ch.sentences.length ? 4 : 2;
  let tiles, slots, hint;
  if (!sent) {
    const a = r ? 'jp' : 'en', b = r ? 'en' : 'jp', ca = r ? 'ja' : 'en', cb = r ? 'en' : 'ja';
    tiles = shuffle(ch.words.map((w, i) => ({ id: i, text: w[a], cls: ca })));
    slots = shuffle(ch.words.map((w, i) => ({ id: i, text: w[b], cls: cb })));
    hint = r ? 'Drag each Japanese tile onto its English meaning.' : 'Drag each English tile onto its Japanese meaning.';
  } else {
    const half = Math.ceil(ch.sentences.length / 2);
    const set = r === 2 ? ch.sentences.slice(0, half) : ch.sentences.slice(half);
    tiles = shuffle(set.map((s, i) => ({ id: i, text: s.part2, cls: 'en' })));
    slots = set.map((s, i) => ({ id: i, text: s.part1, cls: 'en' }));
    hint = 'Drag the missing half into the gap to finish each sentence.';
  }
  app.innerHTML = `<div class="bar"><b>Round ${r + 1} of ${nRounds}</b><span class="clock" id="clock">${SECONDS[r]}</span></div>
    <div class="meter"><i id="meter"></i></div><p class="hint">${hint}</p>
    <section class="tray ${sent ? 'sent' : ''}" id="tray"></section>
    <section class="board ${sent ? '' : 'pairs'}" id="board">${slots.map(s =>
      `<div class="slot ${sent ? 'row' : ''} ${s.cls}" data-id="${s.id}"><span class="lab">${esc(s.text)}</span><span class="well"></span></div>`).join('')}</section>`;
  const tray = document.getElementById('tray');
  let done = 0, over = false;

  tiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tile ' + t.cls; el.textContent = t.text; el.dataset.id = t.id;
    el.addEventListener('pointerdown', e => drag(e, el));
    tray.appendChild(el);
  });

  function drag(e, el) {
    if (over || el.classList.contains('placed')) return;
    e.preventDefault();
    const box = el.getBoundingClientRect(), dx = e.clientX - box.left, dy = e.clientY - box.top;
    const ghost = el.cloneNode(true); ghost.classList.add('ghost');
    ghost.style.width = box.width + 'px';
    const move = (x, y) => { ghost.style.left = (x - dx) + 'px'; ghost.style.top = (y - dy) + 'px'; };
    move(e.clientX, e.clientY); document.body.appendChild(ghost); el.classList.add('lifted');
    let hov = null;
    const slotAt = (x, y) => { const n = document.elementFromPoint(x, y); const s = n && n.closest('.slot'); return s && !s.classList.contains('done') ? s : null; };
    const onMove = ev => { move(ev.clientX, ev.clientY); const s = slotAt(ev.clientX, ev.clientY); if (s !== hov) { hov && hov.classList.remove('hover'); hov = s; hov && hov.classList.add('hover'); } };
    const onUp = ev => {
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp);
      ghost.remove(); hov && hov.classList.remove('hover'); el.classList.remove('lifted');
      const s = over ? null : slotAt(ev.clientX, ev.clientY);
      if (!s) return;
      if (s.dataset.id === el.dataset.id) {
        el.classList.add('placed'); s.querySelector('.well').appendChild(el); s.classList.add('done');
        if (++done === slots.length) setTimeout(() => finish(), 500);
      } else {
        S.misses++; s.classList.add('shake'); setTimeout(() => s.classList.remove('shake'), 350);
      }
    };
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
  }

  const t0 = Date.now(), total = SECONDS[r], clock = document.getElementById('clock'), meter = document.getElementById('meter');
  const timer = setInterval(() => {
    const left = Math.max(0, total - (Date.now() - t0) / 1000);
    clock.textContent = Math.ceil(left); clock.classList.toggle('low', left <= 10);
    meter.style.width = (left / total * 100) + '%';
    if (left <= 0) finish();
  }, 200);

  function finish() {
    if (over) return; over = true; clearInterval(timer);
    S.scores[r] = done; S.totals[r] = slots.length;
    const ov = document.createElement('div'); ov.className = 'over';
    const last = r === nRounds - 1;
    ov.innerHTML = `<div class="card"><h1>Round ${r + 1} complete</h1><div class="big">${done} / ${slots.length}</div>
      <button id="next">${last ? 'See results' : 'Start round ' + (r + 2)}</button></div>`;
    document.body.appendChild(ov);
    const nx = ov.querySelector('#next'); nx.focus();
    nx.onclick = () => { ov.remove(); last ? results() : round(r + 1); };
  }
}

function results() {
  const [a, b, c = 0, d = 0] = S.scores, [ta, tb, tc = 0, td = 0] = S.totals, hasS = S.scores.length > 2;
  app.innerHTML = `<div class="card"><h1>Results</h1>
    <div><b>${esc(S.name)}</b><br>${esc(CH[S.ch].label)} &nbsp;(${new Date().toLocaleDateString()})</div>
    <table class="res">
      <tr><td>Vocabulary, English to Japanese</td><td>${a} / ${ta}</td></tr>
      <tr><td>Vocabulary, Japanese to English</td><td>${b} / ${tb}</td></tr>
      <tr><td>Vocabulary matched in total</td><td>${a + b} / ${ta + tb}</td></tr>
      ${hasS ? `<tr><td>Sentences matched</td><td>${c + d} / ${tc + td}</td></tr>` : ''}
      <tr><td>Wrong drops</td><td>${S.misses}</td></tr>
    </table><button id="again">Play again</button></div>`;
  document.getElementById('again').onclick = setup;
}
load();
</script>
</body>
</html>
