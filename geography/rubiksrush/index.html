<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geo Rush">
<title>Geo Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12141c;color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
.screen{display:none;position:absolute;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}

/* ---------- menu ---------- */
#menu,#results{flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#results{justify-content:flex-start;overflow:auto;-webkit-overflow-scrolling:touch}
h1{font-size:clamp(38px,8vmin,80px);margin:0;letter-spacing:1px}
h1 span{background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.75;font-size:clamp(16px,3vmin,26px);margin:0}
.big{border:0;border-radius:20px;padding:18px 36px;font-size:clamp(22px,4vmin,38px);font-weight:800;min-width:min(80vw,380px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.big.solo{background:#1e88e5}.big.partner{background:#43a047}.big.again{background:#fb8c00}.big.ghost{background:#2a2e3d}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{border:2px solid #3a3f55;background:#1d2030;border-radius:999px;padding:10px 18px;font-size:clamp(15px,2.6vmin,22px);font-weight:700}
.chip.on{background:#fff;color:#12141c;border-color:#fff}
.how{max-width:640px;opacity:.7;font-size:clamp(14px,2.4vmin,20px);line-height:1.4;margin:0}

/* ---------- game ---------- */
#game{flex-direction:column}
.zone{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 14px;gap:8px}
#zone1{transform:rotate(180deg)}
body.solo #zone1{display:none}
.zhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:clamp(16px,3vmin,26px);max-width:900px;width:100%;margin:0 auto}
.pscore{background:#2a2e3d;border-radius:999px;padding:4px 16px}
.clue{display:flex;align-items:center;gap:12px;max-width:900px;width:100%;margin:0 auto;background:#1d2030;border-radius:16px;padding:8px 14px}
.clue-text{flex:1;font-size:clamp(18px,3.6vmin,34px);font-weight:800;text-align:center;line-height:1.15}
.say{border:0;background:#2a2e3d;border-radius:50%;width:48px;height:48px;font-size:22px;flex:none}
.grid{flex:1;min-height:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:10px;width:100%;max-width:900px;margin:0 auto;transition:opacity .15s}
.zone.locked .grid{opacity:.3;pointer-events:none}
.tile{border:0;border-radius:14px;font-weight:800;font-size:clamp(15px,3.4vmin,30px);padding:4px;line-height:1.1;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.28);animation:pop .22s ease-out;word-break:break-word}
.c-red{background:#e53935}.c-blue{background:#1e88e5}.c-green{background:#2e9e45}.c-orange{background:#fb8c00}
.c-yellow{background:#fdd835;color:#222}.c-white{background:#f2f2f2;color:#222}
.tile.found{opacity:.4;transform:scale(.92)}
.tile.found::after{content:" ✓"}
.tile.reveal{outline:6px solid #fff;animation:pulse .5s infinite alternate}
.tile.shake{animation:shake .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{to{transform:scale(1.05)}}
#mid{flex:none;position:relative;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#1a1d2b;font-weight:800;font-size:clamp(15px,2.8vmin,24px)}
#bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:linear-gradient(90deg,#e53935,#fdd835,#43a047);transform-origin:left;transition:transform .1s linear}
#quit{border:0;background:#2a2e3d;border-radius:10px;padding:6px 14px;font-weight:700}

/* ---------- banner ---------- */
#banner{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:#fff;color:#12141c;border-radius:22px;padding:14px 26px;text-align:center;min-width:min(80vw,460px);box-shadow:0 10px 40px rgba(0,0,0,.6);pointer-events:none}
#banner.show{display:block}
#banner .b{font-weight:800}
#banner .bmsg{font-size:clamp(22px,4.4vmin,40px)}
#banner .bsub{font-size:clamp(14px,2.6vmin,22px);opacity:.75;margin-top:4px}
#banner .flip{transform:rotate(180deg);margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed #ccc}
body.solo #banner .flip{display:none}

/* ---------- results ---------- */
.review{max-width:640px;width:100%;text-align:left;background:#1d2030;border-radius:16px;padding:14px 18px;font-size:clamp(15px,2.6vmin,22px)}
.review h3{margin:0 0 8px}
.review li{margin:6px 0}.review b{color:#fdd835}
</style>
</head>
<body>

<main id="menu" class="screen active">
  <h1><span>GEO RUSH</span></h1>
  <p class="sub" id="chapterTitle"></p>
  <button class="big solo" data-mode="solo">1 Player</button>
  <button class="big partner" data-mode="partner">2 Players</button>
  <div class="row">
    <button class="chip" id="optSound"></button>
    <button class="chip" id="optSpeak"></button>
  </div>
  <div class="row" id="timeRow">
    <span class="sub" style="font-size:16px">Solo time:</span>
    <button class="chip" data-time="90">90s</button>
    <button class="chip" data-time="60">60s</button>
    <button class="chip" data-time="40">40s</button>
  </div>
  <p class="how">Read the clue, then tap the matching tiles as fast as you can. Wrong tap = penalty!
  In 2-player mode, put the iPad flat between you. First to finish the round wins the point.</p>
</main>

<main id="game" class="screen">
  <section class="zone" id="zone1">
    <div class="zhead"><span class="pname">Player 2</span><span class="pscore">0</span></div>
    <div class="clue"><button class="say" aria-label="Hear it">🔊</button><span class="clue-text"></span></div>
    <div class="grid"></div>
  </section>
  <div id="mid"><span id="info"></span><button id="quit">✕ Menu</button><div id="bar"></div></div>
  <section class="zone" id="zone0">
    <div class="zhead"><span class="pname">Player 1</span><span class="pscore">0</span></div>
    <div class="clue"><button class="say" aria-label="Hear it">🔊</button><span class="clue-text"></span></div>
    <div class="grid"></div>
  </section>
</main>

<main id="results" class="screen"></main>

<div id="banner">
  <div class="b flip"><div class="bmsg"></div><div class="bsub"></div></div>
  <div class="b"><div class="bmsg"></div><div class="bsub"></div></div>
</div>

<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
