<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Horse Race</title>
<style>
  :root{
    --green:#287b42; --green2:#45a85d; --track:#d8a55e; --track2:#efc47b;
    --cream:#fff6df; --ink:#183022; --red:#d83a32; --blue:#1769aa;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#dff3ff;color:var(--ink)}
  button,select{font:inherit}
  .app{min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,#075da0,#1684c4);color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  header h1{font-size:clamp(20px,3vw,32px);margin:0}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button{border:0;border-radius:10px;padding:9px 12px;font-weight:700}
  select{background:#fff;color:#163044}
  button{cursor:pointer;background:#ffd24a;color:#342500}
  button.secondary{background:#fff;color:#17415b}
  button.danger{background:#e9544f;color:#fff}
  main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;padding:14px;flex:1;min-height:0}
  .boardWrap{background:#8fcf67;border-radius:18px;padding:10px;min-width:0;overflow:hidden;box-shadow:0 4px 14px #0002}
  .board{position:relative;width:100%;aspect-ratio:16/10;min-height:520px;overflow:hidden;border-radius:14px;background:
    radial-gradient(circle at 50% 50%,#b9e88b 0 23%,transparent 24%),
    linear-gradient(#79bd5c,#4c9f4e)}
  .track{position:absolute;inset:8% 7%;border:70px solid var(--track);border-radius:46% 54% 48% 52% / 42% 44% 56% 58%;box-shadow:inset 0 0 0 6px #fff, inset 0 0 0 12px #c53d36}
  .inner{position:absolute;inset:18% 17%;background:#7fcf61;border-radius:48% 52% 50% 50%;border:5px solid #fff;box-shadow:0 0 0 7px #c53d36}
  .stand{position:absolute;background:#f4f4f4;border:5px solid #39708d;border-radius:10px;box-shadow:0 3px 6px #0003;z-index:2}
  .stand.top{left:25%;right:25%;top:1%;height:11%}
  .stand.bottom{left:8%;right:8%;bottom:1%;height:9%}
  .stand:after{content:"";position:absolute;inset:18% 3%;background:repeating-linear-gradient(90deg,#ef4545 0 7px,#ffd64c 7px 14px,#2b82d3 14px 21px,#48a75a 21px 28px);border-radius:6px}
  .startBox{position:absolute;left:2%;top:5%;width:18%;height:22%;background:#1769aa;border:5px solid #fff;border-radius:14px;color:#fff;z-index:8;text-align:center;padding:8px;box-shadow:0 5px 10px #0003}
  .startBox strong{font-size:clamp(18px,2.4vw,32px);display:block}
  .startSlots{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;height:70%;padding:3px}
  .finish{position:absolute;right:1.5%;top:38%;width:10%;height:24%;z-index:7;background:#df3939;color:#fff;border:5px solid #fff;border-radius:12px;text-align:center;padding:7px;font-weight:900;display:flex;flex-direction:column;justify-content:center;box-shadow:0 5px 10px #0003}
  .finish .flag{font-size:24px}
  .spaces{position:absolute;inset:9% 7%;z-index:6;pointer-events:none}
  .space{position:absolute;width:13%;height:16%;background:linear-gradient(145deg,#f6d38f,#e9b96d);border:4px solid #fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3vw,38px);font-weight:900;color:#5b3519;box-shadow:0 2px 5px #0002}
  /* 16 positions around the oval, clockwise */
  .p1{left:21%;top:0}.p2{left:35%;top:0}.p3{left:49%;top:0}.p4{right:6%;top:10%}
  .p5{right:0;top:29%}.p6{right:0;top:48%}.p7{right:5%;bottom:9%}
  .p8{right:20%;bottom:0}.p9{right:35%;bottom:0}.p10{right:50%;bottom:0}.p11{left:21%;bottom:0}
  .p12{left:6%;bottom:9%}.p13{left:0;top:48%}.p14{left:0;top:29%}.p15{left:31%;top:21%}.p16{left:48%;top:21%}
  .horse{position:absolute;z-index:10;width:58px;height:48px;object-fit:cover;border-radius:10px;filter:drop-shadow(0 3px 2px #0005);transition:left .45s ease,top .45s ease,transform .45s ease}
  .horse.small{width:48px;height:40px}
  .horseToken{position:absolute;z-index:12;width:64px;height:48px;border-radius:50%;background:#fff;border:3px solid #222;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 3px 6px #0005;transition:transform .35s ease}
  .side{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 14px #0002;overflow:auto}
  .side h2{margin:0 0 10px;font-size:21px}
  .teamList{display:flex;flex-direction:column;gap:8px}
  .team{border:2px solid #dbe4e9;border-radius:12px;padding:8px;background:#f8fbfd}
  .team.active{border-color:#1769aa;background:#eaf6ff}
  .teamHead{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .teamName{font-weight:900}
  .pos{font-size:13px;color:#52646d}
  .moveBtns{display:flex;gap:6px;margin-top:6px}
  .moveBtns button{flex:1;padding:7px}
  .move2{background:#42a85b;color:#fff}
  .move1{background:#f1a832;color:#fff}
  .history{margin-top:12px;border-top:1px solid #ddd;padding-top:10px;font-size:13px;color:#52646d}
  .help{background:#fff8dc;border:1px solid #eed27b;border-radius:10px;padding:9px;margin-bottom:10px;font-size:13px}
  .winner{font-size:20px;font-weight:900;color:#b37700;text-align:center;padding:8px;background:#fff4bd;border-radius:10px;margin-bottom:10px;display:none}
  @media(max-width:900px){main{grid-template-columns:1fr}.side{max-height:none}.board{min-height:460px}}
  @media(max-width:650px){.board{min-height:400px}.track{border-width:48px}.space{border-width:3px}.horse{width:46px;height:38px}.horseToken{width:50px;height:40px;font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🏇 Classroom Horse Race</h1>
  <div class="controls">
    <label for="teamCount">Teams:</label>
    <select id="teamCount">
      <option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
      <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
    </select>
    <button id="newRace">New Race</button>
    <button id="reset" class="danger">Reset</button>
  </div>
</header>
<main>
  <section class="boardWrap">
    <div class="board" id="board">
      <div class="stand top"></div><div class="stand bottom"></div>
      <div class="track"></div><div class="inner"></div>
      <div class="startBox"><strong>START</strong><div class="startSlots" id="startSlots"></div></div>
      <div class="finish"><div class="flag">🏁</div>FINISH</div>
      <div class="spaces" id="spaces"></div>
    </div>
  </section>
  <aside class="side">
    <div class="help"><b>How to play:</b> Correct answer = <b>+2</b>. Mistake = <b>+1</b>. There are 8 questions. Use the team buttons to move each horse.</div>
    <div id="winner" class="winner"></div>
    <h2>Teams</h2>
    <div id="teamList" class="teamList"></div>
    <div class="history" id="history">Race ready.</div>
  </aside>
</main>
</div>
<script>
(() => {
  const HORSE_COUNT = 12;
  const MAX_SPACE = 16;
  const QUESTIONS = 8;

  // The generated horse sheet is arranged as 12 large horses in the top half
  // and 12 small matching horses in the bottom half. These crop regions are
  // used as visual horse tokens. The numbered badge is overlaid by CSS.
  const horseImage = "assets/horses.png";

  const state = { teams: [], history: [], questions: 0 };
  const teamCount = document.getElementById("teamCount");
  const teamList = document.getElementById("teamList");
  const startSlots = document.getElementById("startSlots");
  const spaces = document.getElementById("spaces");
  const board = document.getElementById("board");
  const historyEl = document.getElementById("history");
  const winnerEl = document.getElementById("winner");

  const positions = [
    {x:23,y:7},{x:37,y:7},{x:51,y:7},{x:78,y:15},
    {x:88,y:34},{x:88,y:53},{x:78,y:75},{x:64,y:86},
    {x:49,y:86},{x:34,y:86},{x:22,y:86},{x:8,y:75},
    {x:2,y:53},{x:2,y:34},{x:33,y:29},{x:51,y:29}
  ];

  function makeSpaces(){
    spaces.innerHTML = "";
    for(let i=1;i<=MAX_SPACE;i++){
      const d=document.createElement("div");
      d.className="space p"+i;
      d.textContent=i;
      spaces.appendChild(d);
    }
  }

  function makeTeam(i){
    return { id:i+1, position:0, done:false };
  }

  function resetRace(){
    const n = Number(teamCount.value);
    state.teams = Array.from({length:n},(_,i)=>makeTeam(i));
    state.history=[];
    state.questions=0;
    winnerEl.style.display="none";
    winnerEl.textContent="";
    render();
    log("New race started with "+n+" teams.");
  }

  function horseCrop(teamId, large=true){
    // The composite horse image is used as a visual source. Each token uses
    // an object-position crop from the sheet; the numbered badge is added separately.
    const col=(teamId-1)%6, row=Math.floor((teamId-1)/6);
    const img=document.createElement("img");
    img.className="horse "+(large?"":"small");
    img.src=horseImage;
    img.alt="Horse "+teamId;
    img.style.objectPosition=`${col*20+10}% ${large ? (row*47+24) : (row*47+75)}%`;
    img.style.objectFit="cover";
    return img;
  }

  function createHorseToken(team){
    const wrap=document.createElement("div");
    wrap.className="horseToken";
    wrap.title="Team "+team.id;
    wrap.appendChild(horseCrop(team.id,true));
    const label=document.createElement("span");
    label.textContent=team.id;
    label.style.position="absolute";
    label.style.right="-5px";
    label.style.top="-9px";
    label.style.width="24px";
    label.style.height="24px";
    label.style.borderRadius="50%";
    label.style.background="#fff";
    label.style.border="2px solid #222";
    label.style.display="grid";
    label.style.placeItems="center";
    label.style.fontSize="12px";
    label.style.fontWeight="900";
    wrap.appendChild(label);
    return wrap;
  }

  function boardPoint(pos){
    if(pos<=0) return null;
    const p=positions[Math.min(pos,MAX_SPACE)-1];
    const bw=board.clientWidth, bh=board.clientHeight;
    return {left:(p.x/100*bw)-32, top:(p.y/100*bh)-24};
  }

  function render(){
    startSlots.innerHTML="";
    teamList.innerHTML="";
    state.teams.forEach(team=>{
      const mini=document.createElement("div");
      mini.style.width="42px"; mini.style.height="30px"; mini.style.position="relative";
      const img=horseCrop(team.id,false);
      img.style.position="absolute"; img.style.inset="0";
      mini.appendChild(img);
      startSlots.appendChild(mini);

      const row=document.createElement("div");
      row.className="team"+(team.done?"":" active");
      row.innerHTML=`<div class="teamHead"><span class="teamName">Team ${team.id}</span><span class="pos">${team.position===0?"START":team.position===16?"FINISH":"Space "+team.position}</span></div>`;
      const btns=document.createElement("div");
      btns.className="moveBtns";
      const b2=document.createElement("button"); b2.className="move2"; b2.textContent="✓ Correct +2"; b2.onclick=()=>move(team.id,2);
      const b1=document.createElement("button"); b1.className="move1"; b1.textContent="✗ Mistake +1"; b1.onclick=()=>move(team.id,1);
      btns.append(b2,b1); row.appendChild(btns); teamList.appendChild(row);
    });

    board.querySelectorAll(".horseToken").forEach(e=>e.remove());
    state.teams.forEach(team=>{
      if(team.position>0){
        const token=createHorseToken(team);
        const p=boardPoint(team.position);
        token.style.left=p.left+"px"; token.style.top=p.top+"px";
        board.appendChild(token);
      }
    });
  }

  function move(id, amount){
    const team=state.teams.find(t=>t.id===id);
    if(!team || team.done) return;
    state.questions++;
    const old=team.position;
    team.position=Math.min(MAX_SPACE, team.position+amount);
    if(team.position===MAX_SPACE) team.done=true;
    state.history.unshift(`Team ${id}: ${old===0?"START":old} → ${team.position} (${amount===2?"correct":"mistake"})`);
    if(team.done){
      winnerEl.textContent=`🏆 Team ${id} reached FINISH!`;
      winnerEl.style.display="block";
    }
    render();
    historyEl.innerHTML=`<b>Last moves</b><br>${state.history.slice(0,8).join("<br>")}`;
  }

  function log(text){ historyEl.innerHTML=text; }
  document.getElementById("newRace").addEventListener("click", resetRace);
  document.getElementById("reset").addEventListener("click", resetRace);
  teamCount.addEventListener("change", resetRace);
  makeSpaces();
  resetRace();
})();
</script>
</body>
</html>
